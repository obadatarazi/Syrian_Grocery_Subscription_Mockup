<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>حصري | لوحة الإدارة</title>
    <meta name="application-name" content="حصري" />
    <link rel="icon" type="image/png" href="/aromacare-ar-logo.png" />
    <meta
      name="description"
      content="حصري — لوحة إدارة خدمة الاشتراك الغذائي في سوريا."
    />
    <meta name="robots" content="noindex, nofollow" />
    <script>
      (function () {
        try {
          // Default to Arabic; respect stored preference
          var lang = localStorage.getItem("aroma-language") || "ar";
          document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
          document.documentElement.lang = lang;
        } catch (_) {}
      })();
    </script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #root {
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
